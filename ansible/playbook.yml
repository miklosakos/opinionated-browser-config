---
- hosts: workstation
  become: true
  roles:
    - role: browsers
  vars:
    home: "https://google.com"
    search:
      name: "Kagi"
      url: "https://kagi.com/search?q={searchTerms}"
    bookmarks:
      folderName: "Folder"
      links:
        - name: "Bookmark 1"
          url: "https://google.com"
        - name: "Bookmark 2"
          url: "https://drive.google.com"
        - name: "Bookmark 3"
          url: "https://kagi.com"
    ublock: true
    firefox_ublock_filters:
      - "user-filters"
      - "ublock-filters"
      - "ublock-badware"
      - "ublock-privacy"
      - "ublock-quick-fixes"
      - "ublock-unbreak"
      - "ublock-experimental"
      - "easylist"
      - "adguard-generic"
      - "adguard-mobile"
      - "easyprivacy"
      - "adguard-spyware-url"
      - "block-lan"
      - "urlhaus-1"
      - "curben-phishing"
      - "plowe-0"
      - "dpollock-0"
      - "fanboy-cookiemonster"
      - "ublock-cookies-easylist"
